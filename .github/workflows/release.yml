# EchoJS release pipeline, two event-driven phases in one file.  Both
# phases MUST live in this file: npm trusted publishing validates
# owner/repo + the workflow filename (release.yml) against the
# trusted-publisher config on npmjs.com, so renaming this file or
# moving the publish step to another workflow breaks publishing.
#
# Phase 1 — a v<semver> tag is pushed (prepare-release.sh makes the
# tag; pushing it is the first of the two human acts):
#
#   version-check   the tag, package.json, the npm wrapper, and the
#                   CHANGELOG all agree
#   build-and-test  the SAME per-platform builds CI runs
#                   (build-and-test.yml): stage ladder + dist tarballs
#                   + package smokes on all three platforms, plus the
#                   test262 conformance run — a regression against the
#                   committed baseline reddens the matrix and holds
#                   the release
#   publish         a DRAFT GitHub release holding the three tarballs,
#                   the generated homebrew formula (hosted urls), and
#                   the npm wrapper tgz; changelog section = notes.
#                   The draft is the staging release: draft asset urls
#                   are not public, and nothing outside GitHub points
#                   at it yet.
#   smoke-*         clean-machine proof: a bare ubuntu container and a
#                   fresh macos runner install ONLY the tarball + the
#                   documented prerequisites, then compile and run a
#                   program through the installed layout.
#
# Phase 2 — the human publishes the draft (the second and last human
# act: the web UI's Publish button, or
# `gh release edit vX.Y.Z --draft=false`):
#
#   go-live         fires on release:published, once the asset urls
#                   resolve publicly.  Verifies they do, pushes the
#                   formula to the tap (iff HOMEBREW_TAP_TOKEN is
#                   configured), npm-publishes the wrapper via OIDC
#                   trusted publishing
#                   (docs.npmjs.com/trusted-publishers) — no token —
#                   gated on the NPM_TRUSTED_PUBLISHING repo variable
#                   being "true" so releases stay green until the
#                   publisher is configured on npmjs.com, and proves
#                   the result by installing the just-published
#                   package from the registry.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # phase 1 hangs off version-check, so this event gate skips the
  # whole build/draft chain on release:published
  version-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tag agrees with the tree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in package.json packaging/npm/package.json; do
            V="$(node -p "require('./$f').version")"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$f has version $V but the tag says $TAG (use packaging/prepare-release.sh)"
              exit 1
            fi
          done
          if ! grep -q "^## \[$TAG\] " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi

  # the same per-platform calls ci.yml makes
  macos-arm64:
    needs: version-check
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: macos-arm64
      runner: macos-15
      typecheck: true
      test262-suite: reduced

  linux-arm64:
    needs: version-check
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: linux-arm64
      runner: ubuntu-24.04-arm
      buck-config: --config llvm.prefix=/usr/lib/llvm-22
      test262-suite: reduced
      lane-expectations: expectations-linux-arm64.txt

  linux-x86_64:
    needs: version-check
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      buck-config: --config llvm.prefix=/usr/lib/llvm-22
      test262-suite: full

  publish:
    needs: [macos-arm64, linux-arm64, linux-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: echojs-dist-*
          merge-multiple: true
          path: assets

      - name: assemble release assets
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls -l assets
          test -f "assets/echojs-$TAG-arm64-macos.tar.gz"
          test -f "assets/echojs-$TAG-arm64-linux.tar.gz"
          test -f "assets/echojs-$TAG-x86_64-linux.tar.gz"

          # homebrew formula: sha from the built tarball, url = the
          # published asset location
          ./packaging/homebrew/make-formula.sh \
            --tarball "assets/echojs-$TAG-arm64-macos.tar.gz" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$TAG/echojs-$TAG-arm64-macos.tar.gz" \
            --out assets/echojs.rb

          # the npm wrapper tgz (version already stamped by
          # prepare-release.sh; its postinstall downloads the tarball
          # asset for the host platform)
          npm pack ./packaging/npm --pack-destination assets

          # release notes = this version's changelog section
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\] " { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-runs replace a leftover draft; an already-PUBLISHED
          # release means go-live happened — refuse to clobber it
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "echojs ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            assets/*

  # phase 2: the outward-facing publishes, running only after the
  # human made the draft public — before that the asset urls the
  # formula and the npm postinstall download from do not resolve
  go-live:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      # release events carry the tag ref, so this checks out the
      # released tree — the wrapper directory npm publish reads
      - uses: actions/checkout@v4

      # trusted publishing needs npm >= 11.5.1 on node >= 22.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest && npm --version

      - name: the released assets resolve publicly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a release tag"; exit 1 ;;
          esac
          V="$(node -p "require('./packaging/npm/package.json').version")"
          if [ "$V" != "$TAG" ]; then
            echo "::error::the tagged tree's npm wrapper says $V but the release tag says $TAG"
            exit 1
          fi
          for triple in arm64-macos arm64-linux x86_64-linux; do
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$TAG/echojs-$TAG-$triple.tar.gz"
            echo "checking $URL"
            curl -sfLI -o /dev/null "$URL" || {
              echo "::error::$URL does not resolve — is the release missing assets?"
              exit 1
            }
          done
          gh release download "$GITHUB_REF_NAME" --pattern echojs.rb --dir assets

      # both publish legs are shell-gated on their secrets: absent
      # secret = loudly-skipped step, not a broken release
      - name: push the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured — formula is attached to the release instead"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/toshok/homebrew-echojs.git" tap
          mkdir -p tap/Formula
          cp assets/echojs.rb tap/Formula/echojs.rb
          cd tap
          git add Formula/echojs.rb
          git -c user.name="echojs release" -c user.email="toshok@gmail.com" \
            commit -m "echojs ${GITHUB_REF_NAME#v}"
          git push

      # OIDC trusted publishing: no token, npm exchanges this job's
      # id-token for short-lived credentials and generates provenance
      # attestations automatically.  Publishes the package DIRECTORY
      # (same bits as the tgz attached to the release — both come from
      # packaging/npm at this ref) so provenance sees the build
      # context.
      - name: npm publish (trusted publishing)
        env:
          TP_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TP_ENABLED" != "true" ]; then
            echo "NPM_TRUSTED_PUBLISHING repo variable not set — wrapper tgz is attached to the release instead"
            echo "(configure the trusted publisher on npmjs.com first: owner toshok, repo echojs, workflow release.yml)"
            exit 0
          fi
          npm publish ./packaging/npm --access public

      # end-to-end proof of the go-live: install what the registry now
      # serves (postinstall downloads and unpacks the public tarball,
      # failing loudly if anything is off).  Retries cover registry
      # propagation lag right after publish.
      - name: install the published package from the registry
        env:
          TP_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TP_ENABLED" != "true" ]; then
            echo "npm publish was skipped — nothing to install"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            if npm install -g "@pirouette/echojs@$TAG"; then
              command -v ejs
              exit 0
            fi
            echo "not installable yet (attempt $i) — waiting for registry propagation"
            sleep 15
          done
          echo "::error::@pirouette/echojs@$TAG did not become installable"
          exit 1

  # a machine that has never seen the repo: only the tarball + the
  # README's documented prerequisites
  smoke-linux:
    needs: [linux-arm64, linux-x86_64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: echojs-dist-linux-${{ matrix.arch }}

      - name: install prerequisites (the README's list)
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg lsb-release \
            software-properties-common build-essential libuv1-dev libunwind-dev
          curl -sSf https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22

      - name: install and compile
        run: |
          tar xzf echojs-*.tar.gz
          sh ./echojs-*/install.sh
          printf 'let xs = [1, 2, 3].map((x) => x * x);\nconsole.log(`squares: ${xs.join(",")}`);\n' > hello.js
          PATH="/usr/lib/llvm-22/bin:$PATH" ejs -q -o hello hello.js
          test "$(./hello)" = "squares: 1,4,9"

  smoke-macos:
    needs: macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: echojs-dist-macos-arm64

      - name: install prerequisites (the README's list)
        run: brew install llvm

      - name: install and compile
        run: |
          tar xzf echojs-*.tar.gz
          sh ./echojs-*/install.sh --prefix "$RUNNER_TEMP/prefix"
          printf 'let xs = [1, 2, 3].map((x) => x * x);\nconsole.log(`squares: ${xs.join(",")}`);\n' > hello.js
          "$RUNNER_TEMP/prefix/bin/ejs" -q -o hello hello.js
          test "$(./hello)" = "squares: 1,4,9"
