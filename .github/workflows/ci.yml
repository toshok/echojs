# EchoJS CI: the root of every build, and the place the platform list
# lives.  One explicit call of build-and-test.yml (the reusable
# per-platform build) per platform — explicit jobs rather than a
# matrix so each platform is a top-level entry in the run display
# (matrix legs of a reusable call all fold into one group).
# release.yml makes the same calls on a version tag.
#
# test262-suite is a per-platform input: macOS and linux-arm64 run the
# reduced lane in-job, each against its own expectations file, and the
# whole suite runs sharded off the x86_64 build, which
# build-and-test.yml dispatches itself so it waits on that build and
# nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-test262-baseline:
        description: rewrite test262 full-baseline.json from this run
        type: boolean
        default: false
      update-lane-expectations:
        description: regenerate the per-platform lane expectations files (uploaded as artifacts)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: macos-arm64
      runner: macos-15
      # platform-independent, so exactly one platform pays for it
      typecheck: true
      test262-suite: reduced
      update-lane-expectations: ${{ inputs.update-lane-expectations || false }}

  linux-arm64:
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: linux-arm64
      runner: ubuntu-24.04-arm
      buck-config: --config llvm.prefix=/usr/lib/llvm-22
      test262-suite: reduced
      lane-expectations: expectations-linux-arm64.txt
      update-lane-expectations: ${{ inputs.update-lane-expectations || false }}

  linux-x86_64:
    uses: ./.github/workflows/build-and-test.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      buck-config: --config llvm.prefix=/usr/lib/llvm-22
      # the build the sharded suite runs against
      test262-suite: full
      update-test262-baseline: ${{ inputs.update-test262-baseline || false }}
