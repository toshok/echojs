# EchoJS CI: the root of every build, and the place the platform list
# lives.  Each platform is one call of bootstrap.yml (the reusable
# per-platform build) so it reports under its own name; release.yml
# makes the same calls on a version tag — one definition, several
# callers, no second workflow racing this one.
#
# test262 runs both ways, and which way is a per-platform input to
# bootstrap.yml: the curated lane in-job on macOS, against
# expectations.txt, and the whole suite sharded off the x86_64 build,
# which bootstrap.yml dispatches itself so it waits on that build and
# nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-test262-baseline:
        description: rewrite test262 full-baseline.json from this run
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    uses: ./.github/workflows/bootstrap.yml
    with:
      platform: macos-arm64
      runner: macos-15
      # platform-independent, so exactly one platform pays for it
      typecheck: true
      # expectations.txt is generated on this platform
      test262-lane: true

  linux-arm64:
    uses: ./.github/workflows/bootstrap.yml
    with:
      platform: linux-arm64
      runner: ubuntu-24.04-arm
      buck-config: --config llvm.prefix=/usr/lib/llvm-22

  linux-x86_64:
    uses: ./.github/workflows/bootstrap.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      buck-config: --config llvm.prefix=/usr/lib/llvm-22
      # the build the sharded suite runs against
      test262-full: true
      update-test262-baseline: ${{ inputs.update-test262-baseline || false }}
